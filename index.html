<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>德州扑克 - Web 版</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="table-wrap">
    <h1>德州扑克（你 vs 电脑）</h1>

    <section class="status-panel">
      <div><strong>阶段：</strong><span id="street">-</span></div>
      <div><strong>底池：</strong><span id="pot">0</span></div>
      <div><strong>当前需跟注：</strong><span id="toCall">0</span></div>
      <div><strong>信息：</strong><span id="message">点击“新一局”开始。</span></div>
    </section>

    <section class="board">
      <h2>公共牌</h2>
      <div id="communityCards" class="cards"></div>
    </section>

    <section class="players">
      <article class="player" id="aiPanel">
        <h3>电脑</h3>
        <p>筹码：<span id="aiChips">1000</span></p>
        <p>本轮下注：<span id="aiBet">0</span></p>
        <div id="aiCards" class="cards"></div>
      </article>

      <article class="player you" id="youPanel">
        <h3>你</h3>
        <p>筹码：<span id="youChips">1000</span></p>
        <p>本轮下注：<span id="youBet">0</span></p>
        <div id="youCards" class="cards"></div>
      </article>
    </section>

    <section class="controls">
      <button id="newHandBtn">新一局</button>
      <button id="checkCallBtn" disabled>过牌 / 跟注</button>
      <button id="betRaiseBtn" disabled>下注 / 加注 (+20)</button>
      <button id="foldBtn" disabled>弃牌</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
